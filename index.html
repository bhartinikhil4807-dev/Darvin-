
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>DARVIN | WEAR THE REBEL</title>

<meta name="description" content="DARVIN premium black streetwear. Wear the Rebel.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050505;
    --card: #111111;
    --white: #ffffff;
    --silver: #c7c7c7;
    --gray: #999999;
    body {
    background: #050505;
    color: #ffffff;
}

header, footer {
    background: #050505;
}

.product-card {
    background: #111111;
    border: 1px solid #292929;
}

.product-card img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}
}

body {
    background: var(--bg);
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

header {
    background: #050505;
    border-bottom: 1px solid #252525;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 29px;
    font-weight: 900;
    letter-spacing: 5px;
}

.logo span {
    color: var(--silver);
}

nav {
    display: flex;
    gap: 22px;
    font-size: 13px;
}

nav a:hover {
    color: var(--silver);
}

.hero {
    min-height: 420px;
    padding: 100px 20px;
    text-align: center;
    background: #050505;
}

.hero h1 {
    font-size: clamp(42px, 9vw, 85px);
    letter-spacing: 8px;
    font-weight: 900;
}

.hero p {
    color: #c0c0c0;
    letter-spacing: 5px;
    margin-top: 18px;
    font-size: 13px;
}

.hero .sub {
    color: #888;
    letter-spacing: 1px;
    margin-top: 20px;
    font-size: 14px;
}

.btn {
    display: inline-block;
    background: white;
    color: black;
    padding: 14px 28px;
    margin-top: 28px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    font-size: 13px;
}

.btn:hover {
    background: #c7c7c7;
}

.section {
    padding: 55px 7%;
}

.section-title {
    text-align: center;
    font-size: 28px;
    letter-spacing: 4px;
    margin-bottom: 35px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.product {
    background: var(--card);
    border: 1px solid #242424;
    padding-bottom: 20px;
}

.product img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    background: #151515;
    display: block;
}

.product-info {
    padding: 18px;
}

.product h3 {
    font-size: 17px;
    margin-bottom: 9px;
}

.price {
    color: var(--silver);
    font-size: 19px;
    font-weight: bold;
}

.product p {
    color: #999;
    font-size: 12px;
    margin-top: 8px;
}

.order-box {
    max-width: 650px;
    margin: auto;
    background: #101010;
    border: 1px solid #292929;
    padding: 28px;
}

.order-box h2 {
    text-align: center;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

.order-note {
    color: #aaa;
    text-align: center;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 25px;
}

label {
    display: block;
    font-size: 13px;
    margin: 16px 0 8px;
    color: #ddd;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    background: #050505;
    color: white;
    border: 1px solid #383838;
    outline: none;
    font-size: 14px;
}

input:focus, select:focus, textarea:focus {
    border-color: white;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.order-btn {
    width: 100%;
    background: white;
    color: black;
    padding: 16px;
    border: none;
    margin-top: 23px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.order-btn:hover {
    background: #ccc;
}

.payment-info {
    background: #151515;
    border: 1px solid #333;
    padding: 20px;
    margin-top: 25px;
    text-align: center;
    line-height: 1.8;
}

.payment-info p {
    color: #aaa;
    font-size: 13px;
}

.details {
    text-align: center;
    color: #aaa;
    line-height: 2;
    font-size: 14px;
}

footer {
    background: #050505;
    border-top: 1px solid #292929;
    padding: 35px 15px;
    text-align: center;
    color: #888;
    font-size: 12px;
    line-height: 2;
}

footer strong {
    color: white;
    letter-spacing: 3px;
}

@media(max-width:600px) {
    header {
        padding: 15px;
    }

    .logo {
        font-size: 23px;
    }

    nav {
        gap: 12px;
        font-size: 11px;
    }

    .hero {
        padding: 85px 15px;
    }

    .section {
        padding: 40px 15px;
    }

    .order-box {
        padding: 18px;
    }

    .product img {
        height: 270px;
    }
}
</style>
</head>

<body>

<header>
    <a href="#" class="logo">DAR<span>VIN</span></a>

    <nav>
        <a href="#home">HOME</a>
        <a href="#shop">SHOP</a>
        <a href="#order">ORDER</a>
        <a href="#contact">CONTACT</a>
    </nav>
</header>

<section class="hero" id="home">

                </button>
            </div>
        </div>

        <div class="product">

                <button class="btn" onclick="selectProduct('Black Gym T-Shirt')">
                    ORDER NOW
                </button>
            </div>
        </div>

        <div class="product">
            <img src="darvin-print-closeup-new.jpg"
                 alt="DARVIN Plain Black T-shirt">
            <div class="product-info">
                <h3>Classic Black T-Shirt</h3
